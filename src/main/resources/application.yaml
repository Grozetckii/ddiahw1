spring:
  application:
    name: ddiahw1
  datasource:
    url: jdbc:h2:mem:db
    driver-class-name: org.h2.Driver

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
      base-path: /
      path-mapping:
        prometheus: metrics
        health: health
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      pod_id: ${POD_ID:unknown-pod}
      datacenter: ${DATACENTER:unknown-dc}